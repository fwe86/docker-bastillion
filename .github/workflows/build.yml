name: Build and publish

on:
  schedule:
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - ".upstream"
      - "UPSTREAM-LICENSE.md"
      - "UPSTREAM-THIRD-PARTY-LICENSES.md"
      - "UPSTREAM-COMPLIANCE.md"
      - "UPSTREAM-COMPONENTS.tsv"
      - "BASE-IMAGE-SOURCE.md"
      - "BASE-IMAGE-PACKAGES-amd64.tsv"
      - "BASE-IMAGE-PACKAGES-arm64.tsv"
      - "BASE-IMAGE-PLATFORMS.tsv"
      - "BASE-IMAGE-SOURCE-PACKAGES.tsv"

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-bastillion
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Loophole-LLC/Bastillion
  IMAGE_NAME: ghcr.io/fwe86/docker-bastillion
  BASE_IMAGE_NAME: eclipse-temurin:21-jre-noble
  MAVEN_DEPENDENCY_PLUGIN_VERSION: "3.11.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve and pin runtime base image
        id: base
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build
          docker buildx imagetools inspect "${BASE_IMAGE_NAME}" \
            --format '{{json .Manifest}}' \
            > .build/base-image-manifest.json

          digest="$(jq -r '.digest // empty' .build/base-image-manifest.json)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: Unable to resolve immutable base image digest for ${BASE_IMAGE_NAME}." >&2
            exit 1
          fi

          for platform in linux/amd64 linux/arm64; do
            count="$(jq --arg p "${platform}" '[.manifests[]? | select((.platform.os + "/" + .platform.architecture) == $p)] | length' .build/base-image-manifest.json)"
            if [[ "${count}" != "1" ]]; then
              echo "ERROR: Expected exactly one ${platform} manifest in ${BASE_IMAGE_NAME}, found ${count}." >&2
              exit 1
            fi
          done

          amd64_digest="$(jq -r '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty' .build/base-image-manifest.json)"
          arm64_digest="$(jq -r '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "arm64")][0].digest // empty' .build/base-image-manifest.json)"
          for platform_digest in "${amd64_digest}" "${arm64_digest}"; do
            if [[ ! "${platform_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: Invalid platform-specific base-image digest: ${platform_digest:-missing}" >&2
              exit 1
            fi
          done

          ref="${BASE_IMAGE_NAME}@${digest}"
          {
            echo "digest=${digest}"
            echo "ref=${ref}"
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
          } >> "${GITHUB_OUTPUT}"

          echo "Pinned base image index: ${ref}"
          echo "Pinned linux/amd64 manifest: ${BASE_IMAGE_NAME}@${amd64_digest}"
          echo "Pinned linux/arm64 manifest: ${BASE_IMAGE_NAME}@${arm64_digest}"

      - name: Determine latest stable Bastillion release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest"
          )"

          draft="$(jq -r '.draft' <<< "${release}")"
          prerelease="$(jq -r '.prerelease' <<< "${release}")"
          tag="$(jq -r '.tag_name' <<< "${release}")"
          release_url="$(jq -r '.html_url' <<< "${release}")"

          if [[ "${draft}" != "false" || "${prerelease}" != "false" ]]; then
            echo "ERROR: Latest release is not stable." >&2
            exit 1
          fi

          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "ERROR: No release tag found." >&2
            exit 1
          fi

          version="${tag#v}"
          asset_name="bastillion-${version}.jar"

          asset_count="$(
            jq \
              --arg name "${asset_name}" \
              '[.assets[] | select(.name == $name)] | length' \
              <<< "${release}"
          )"

          if [[ "${asset_count}" != "1" ]]; then
            echo "ERROR: Expected exactly one ${asset_name} asset." >&2
            exit 1
          fi

          asset_url="$(
            jq -r \
              --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<< "${release}"
          )"

          digest="$(
            jq -r \
              --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .digest' \
              <<< "${release}"
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Missing or invalid SHA-256 digest." >&2
            exit 1
          fi

          sha256="${digest#sha256:}"

          stored_version="$(
            grep '^BASTILLION_VERSION=' .upstream 2>/dev/null \
              | cut -d= -f2- || true
          )"

          stored_sha256="$(
            grep '^BASTILLION_SHA256=' .upstream 2>/dev/null \
              | cut -d= -f2- || true
          )"

          stored_base_digest="$(
            grep '^BASE_IMAGE_DIGEST=' .upstream 2>/dev/null \
              | cut -d= -f2- || true
          )"

          build="true"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" \
             && "${stored_version}" == "${version}" \
             && "${stored_sha256}" == "${sha256}" \
             && "${stored_base_digest}" == "${{ steps.base.outputs.digest }}" ]]; then
            build="false"
          fi

          {
            echo "build=${build}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha256=${sha256}"
            echo "asset_url=${asset_url}"
            echo "release_url=${release_url}"
          } >> "${GITHUB_OUTPUT}"

          echo "Bastillion version: ${version}"
          echo "Build required: ${build}"

      - name: Download and verify upstream release and metadata
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build/upstream-metadata .build/upstream-npm

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            "${{ steps.upstream.outputs.asset_url }}" \
            --output .build/bastillion.jar

          printf '%s  %s\n' \
            "${{ steps.upstream.outputs.sha256 }}" \
            ".build/bastillion.jar" \
            | sha256sum --check -

          base="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${{ steps.upstream.outputs.tag }}"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/LICENSE.md" \
            --output .build/LICENSE.md

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/3rdPartyLicenses.md" \
            --output .build/3rdPartyLicenses.md

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/pom.xml" \
            --output .build/upstream-metadata/pom.xml

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/package.json" \
            --output .build/upstream-npm/package.json

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/package-lock.json" \
            --output .build/upstream-npm/package-lock.json

      - name: Set up Java 21 for Maven dependency resolution
        if: steps.upstream.outputs.build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js for npm license collection
        if: steps.upstream.outputs.build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"

      - name: Resolve Maven runtime components and source artifacts
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -f .build/upstream-metadata/pom.xml \
            "org.apache.maven.plugins:maven-dependency-plugin:${MAVEN_DEPENDENCY_PLUGIN_VERSION}:list" \
            -DincludeScope=runtime \
            -DoutputAbsoluteArtifactFilename=true \
            -DappendOutput=false \
            -DoutputFile="${GITHUB_WORKSPACE}/.build/maven-dependencies.txt"

          rm -rf .build/maven-sources
          mkdir -p .build/maven-sources

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -f .build/upstream-metadata/pom.xml \
            "org.apache.maven.plugins:maven-dependency-plugin:${MAVEN_DEPENDENCY_PLUGIN_VERSION}:copy-dependencies" \
            -DincludeScope=runtime \
            -Dclassifier=sources \
            -Dmdep.failOnMissingClassifierArtifact=false \
            -Dmdep.useRepositoryLayout=true \
            -DoutputDirectory="${GITHUB_WORKSPACE}/.build/maven-sources"

      - name: Resolve Maven components discovered only inside the shaded JAR
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/resolve_embedded_maven.py \
            --jar .build/bastillion.jar \
            --maven-list .build/maven-dependencies.txt \
            --plugin-version "${MAVEN_DEPENDENCY_PLUGIN_VERSION}"

      - name: Materialize npm packages from the exact upstream lock file
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        working-directory: .build/upstream-npm
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Build and validate independent third-party compliance bundle
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/collect_compliance.py \
            --upstream-jar .build/bastillion.jar \
            --maven-list .build/maven-dependencies.txt \
            --maven-sources .build/maven-sources \
            --package-lock .build/upstream-npm/package-lock.json \
            --node-modules .build/upstream-npm/node_modules \
            --upstream-version "${{ steps.upstream.outputs.version }}" \
            --upstream-tag "${{ steps.upstream.outputs.tag }}" \
            --upstream-repo "${UPSTREAM_REPO}" \
            --output .build/compliance

          test -s .build/compliance/COMPLIANCE.md
          test -s .build/compliance/COMPONENTS.tsv
          test -s .build/compliance/SHA256SUMS

          (
            cd .build/compliance
            sha256sum --check SHA256SUMS
          )

      - name: Install Ubuntu source retrieval tooling
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ubuntu-dev-tools

      - name: Materialize exact runtime base-image corresponding source
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/collect_base_image_sources.py \
            --base-image-ref "${{ steps.base.outputs.ref }}" \
            --base-image-name "${BASE_IMAGE_NAME}" \
            --base-image-digest "${{ steps.base.outputs.digest }}" \
            --manifest .build/base-image-manifest.json \
            --output .build/base-source

          test -s .build/base-source/README.md
          test -s .build/base-source/SOURCE-PACKAGES.tsv
          test -s .build/base-source/SHA256SUMS
          test -s .build/base-source/inventory/DPKG-PACKAGES-amd64.tsv
          test -s .build/base-source/inventory/DPKG-PACKAGES-arm64.tsv
          test -s .build/base-source/inventory/PLATFORM-MANIFESTS.tsv

          (
            cd .build/base-source
            sha256sum --check SHA256SUMS
          )

      - name: Create deterministic base-image source archive
        if: steps.upstream.outputs.build == 'true'
        id: base_source_archive
        shell: bash
        run: |
          set -euo pipefail

          base_short="${{ steps.base.outputs.digest }}"
          base_short="${base_short#sha256:}"
          base_short="${base_short:0:12}"
          commit_short="${GITHUB_SHA:0:12}"
          source_tag="source-${{ steps.upstream.outputs.version }}-${commit_short}-${base_short}"
          archive_name="docker-bastillion-${{ steps.upstream.outputs.version }}-base-sources-${commit_short}-${base_short}.tar.gz"
          archive_path="${GITHUB_WORKSPACE}/.build/${archive_name}"

          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C .build/base-source \
            -cf - . \
            | gzip -n -9 > "${archive_path}"

          archive_sha256="$(sha256sum "${archive_path}" | awk '{print $1}')"
          archive_size="$(stat -c '%s' "${archive_path}")"

          if [[ ! "${archive_sha256}" =~ ^[0-9a-f]{64}$ || "${archive_size}" -le 0 ]]; then
            echo "ERROR: Invalid base-image source archive." >&2
            exit 1
          fi

          {
            echo "source_tag=${source_tag}"
            echo "archive_name=${archive_name}"
            echo "archive_path=${archive_path}"
            echo "archive_sha256=${archive_sha256}"
            echo "archive_size=${archive_size}"
          } >> "${GITHUB_OUTPUT}"

          printf '%s  %s\n' "${archive_sha256}" "${archive_name}" \
            > .build/base-source-archive.sha256

      - name: Log in to GitHub Container Registry
        if: steps.upstream.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up ORAS
        if: steps.upstream.outputs.build == 'true'
        uses: oras-project/setup-oras@v2.0.1
        with:
          # setup-oras v2.0.1 only bundles release metadata through ORAS 1.3.3.
          # Install the current ORAS 1.3.4 release from its official release asset
          # and pin the upstream-published SHA-256 instead of relying on the
          # action's embedded release catalog.
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454

      - name: Publish and verify durable base-image source distribution
        if: steps.upstream.outputs.build == 'true'
        id: base_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_tag="${{ steps.base_source_archive.outputs.source_tag }}"
          archive_name="${{ steps.base_source_archive.outputs.archive_name }}"
          archive_path="${{ steps.base_source_archive.outputs.archive_path }}"
          archive_sha256="${{ steps.base_source_archive.outputs.archive_sha256 }}"
          source_oci_ref="${IMAGE_NAME}:${source_tag}"

          (
            cd .build
            oras push \
              --artifact-type application/vnd.fwe86.docker-bastillion.corresponding-source.v1 \
              "${source_oci_ref}" \
              "${archive_name}:application/gzip"
          )

          source_oci_digest="$(oras resolve "${source_oci_ref}")"
          if [[ ! "${source_oci_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: Invalid OCI source artifact digest: ${source_oci_digest}" >&2
            exit 1
          fi
          source_oci_digest_ref="${IMAGE_NAME}@${source_oci_digest}"

          release_tag="${source_tag}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${archive_name}"
          notes_file=.build/base-source-release-notes.md
          cat > "${notes_file}" <<EOF
          Corresponding source for the runtime base of docker-bastillion ${{ steps.upstream.outputs.version }}.

          Base image index: ${BASE_IMAGE_NAME}@${{ steps.base.outputs.digest }}
          linux/amd64 manifest: ${BASE_IMAGE_NAME}@${{ steps.base.outputs.amd64_digest }}
          linux/arm64 manifest: ${BASE_IMAGE_NAME}@${{ steps.base.outputs.arm64_digest }}
          Source archive SHA-256: ${archive_sha256}
          OCI source artifact: ${source_oci_digest_ref}

          This release exists to provide durable, no-charge access to the exact
          source bundle accompanying the distributed container image.
          EOF

          get_release_asset_digest() {
            local digest=""
            for attempt in $(seq 1 15); do
              digest="$(
                gh api \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
                  --jq ".assets[]? | select(.name == \"${archive_name}\") | .digest" \
                  | head -n1
              )"
              if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "${digest}"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            remote_digest="$(get_release_asset_digest || true)"
            if [[ "${remote_digest}" != "sha256:${archive_sha256}" ]]; then
              gh release upload "${release_tag}" "${archive_path}" --clobber
            fi
          else
            gh release create "${release_tag}" "${archive_path}" \
              --target "${GITHUB_SHA}" \
              --title "Corresponding source: Bastillion ${{ steps.upstream.outputs.version }} / ${source_tag}" \
              --notes-file "${notes_file}" \
              --latest=false
          fi

          remote_digest="$(get_release_asset_digest || true)"
          if [[ "${remote_digest}" != "sha256:${archive_sha256}" ]]; then
            echo "ERROR: GitHub Release source asset digest mismatch: ${remote_digest:-missing}" >&2
            exit 1
          fi

          cat > .build/base-source-pointer.md <<EOF
          # Corresponding source for the runtime base image

          The published image was built from the immutable base image:

          ${BASE_IMAGE_NAME}@${{ steps.base.outputs.digest }}

          The exact platform manifests inspected for package/source mapping were:

          - linux/amd64: ${BASE_IMAGE_NAME}@${{ steps.base.outputs.amd64_digest }}
          - linux/arm64: ${BASE_IMAGE_NAME}@${{ steps.base.outputs.arm64_digest }}

          Complete corresponding source material collected for the Ubuntu packages
          present in both published architectures and for the Eclipse Temurin/OpenJDK
          runtime is available without charge through both of these locations:

          - OCI/GHCR artifact: ${source_oci_digest_ref}
          - GitHub Release asset: ${release_url}

          Source archive SHA-256:

          ${archive_sha256}

          To retrieve the immutable OCI artifact by digest:

          oras pull ${source_oci_digest_ref}

          The source bundle contains exact binary-to-source package inventories for
          linux/amd64 and linux/arm64, the exact Ubuntu source package versions with
          their .dsc checksum sets verified, and the exact Temurin/OpenJDK source
          archive verified against Adoptium's published SHA-256. Adoptium release
          metadata and the exact temurin-build commit archive(s) referenced by that
          metadata are included as build-script source and provenance evidence.
          EOF

          {
            echo "oci_ref=${source_oci_ref}"
            echo "oci_digest=${source_oci_digest}"
            echo "oci_digest_ref=${source_oci_digest_ref}"
            echo "release_tag=${release_tag}"
            echo "release_url=${release_url}"
            echo "archive_sha256=${archive_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload compliance evidence
        if: steps.upstream.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bastillion-${{ steps.upstream.outputs.version }}-license-compliance
          path: .build/compliance/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Upload base-image source evidence
        if: steps.upstream.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bastillion-${{ steps.upstream.outputs.version }}-base-image-source-evidence
          path: |
            .build/base-image-manifest.json
            .build/base-source-pointer.md
            .build/base-source-archive.sha256
            .build/base-source/README.md
            .build/base-source/SOURCE-PACKAGES.tsv
            .build/base-source/SHA256SUMS
            .build/base-source/inventory/
            .build/base-source/legal-evidence/
            .build/base-source/adoptium-container/
            .build/base-source/temurin/SOURCE-INFO.tsv
            .build/base-source/temurin/BUILD-SCRIPTS.tsv
            .build/base-source/temurin/release-metadata/
            .build/base-source/temurin/*.sha256.txt
            .build/base-source/temurin/*.sig
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Build verification image
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: docker-bastillion:test
          build-args: |
            BASE_IMAGE_REF=${{ steps.base.outputs.ref }}
            BASE_IMAGE_NAME=${{ env.BASE_IMAGE_NAME }}
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            BASE_SOURCE_OCI_REF=${{ steps.base_source.outputs.oci_digest_ref }}
            BASE_SOURCE_OCI_DIGEST=${{ steps.base_source.outputs.oci_digest }}
            BASE_SOURCE_RELEASE_URL=${{ steps.base_source.outputs.release_url }}
            BASE_SOURCE_SHA256=${{ steps.base_source.outputs.archive_sha256 }}
            BASTILLION_VERSION=${{ steps.upstream.outputs.version }}

      - name: Verify license material inside image
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --entrypoint /bin/sh docker-bastillion:test -c '
            set -eu
            test -s /opt/bastillion/licenses/packaging/LICENSE-MIT
            test -s /opt/bastillion/licenses/upstream/LICENSE.md
            test -s /opt/bastillion/licenses/upstream/3rdPartyLicenses.md
            test -s /opt/bastillion/licenses/compliance/COMPLIANCE.md
            test -s /opt/bastillion/licenses/compliance/COMPONENTS.tsv
            test -s /opt/bastillion/licenses/compliance/SHA256SUMS
            test -d /opt/bastillion/licenses/compliance/maven
            test -d /opt/bastillion/licenses/compliance/npm
            test -d /opt/bastillion/licenses/jar-notices
            test -s /opt/bastillion/licenses/base-image/DPKG-PACKAGES.tsv
            test -s /opt/bastillion/licenses/base-image/JAVA-VERSION.txt
            test -s /opt/bastillion/licenses/base-image/SOURCE-LOCATION.env
            test -s /opt/bastillion/licenses/base-image/CORRESPONDING-SOURCE.md
            test -s /opt/bastillion/licenses/base-image/ADOPTIUM-CONTAINERS-LICENSE-APACHE-2.0.txt
            test -d /opt/java/openjdk/legal
            grep -Fq "BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}" /opt/bastillion/licenses/base-image/SOURCE-LOCATION.env
            grep -Fq "BASE_SOURCE_OCI_DIGEST=${{ steps.base_source.outputs.oci_digest }}" /opt/bastillion/licenses/base-image/SOURCE-LOCATION.env
            grep -Fq "BASE_SOURCE_SHA256=${{ steps.base_source.outputs.archive_sha256 }}" /opt/bastillion/licenses/base-image/SOURCE-LOCATION.env
            cd /opt/bastillion/licenses/compliance
            sha256sum -c SHA256SUMS >/dev/null
          '

          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' docker-bastillion:test)" = "${{ steps.base.outputs.digest }}"
          test "$(docker inspect --format '{{ index .Config.Labels "io.github.fwe86.docker-bastillion.base-source.oci-digest" }}' docker-bastillion:test)" = "${{ steps.base_source.outputs.oci_digest }}"
          test "$(docker inspect --format '{{ index .Config.Labels "io.github.fwe86.docker-bastillion.base-source.sha256" }}' docker-bastillion:test)" = "${{ steps.base_source.outputs.archive_sha256 }}"

      - name: Test container
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          container="$(
            docker run \
              --detach \
              --env TLS_ENABLED=false \
              --env PORT=8080 \
              --publish 127.0.0.1:18080:8080 \
              docker-bastillion:test
          )"

          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            running="$(
              docker inspect \
                --format '{{.State.Running}}' \
                "${container}" \
                2>/dev/null || true
            )"

            if [[ "${running}" != "true" ]]; then
              docker logs "${container}" >&2 || true
              exit 1
            fi

            http_code="$(
              curl \
                --silent \
                --output /dev/null \
                --max-time 2 \
                --write-out '%{http_code}' \
                http://127.0.0.1:18080/ \
                2>/dev/null || true
            )"

            if [[ "${http_code}" =~ ^[234][0-9][0-9]$ ]]; then
              echo "Bastillion responded with HTTP ${http_code}."
              exit 0
            fi

            sleep 2
          done

          docker logs "${container}" >&2 || true
          echo "ERROR: Bastillion did not become ready." >&2
          exit 1

      - name: Build and publish image with SBOM and provenance
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BASE_IMAGE_REF=${{ steps.base.outputs.ref }}
            BASE_IMAGE_NAME=${{ env.BASE_IMAGE_NAME }}
            BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            BASE_SOURCE_OCI_REF=${{ steps.base_source.outputs.oci_digest_ref }}
            BASE_SOURCE_OCI_DIGEST=${{ steps.base_source.outputs.oci_digest }}
            BASE_SOURCE_RELEASE_URL=${{ steps.base_source.outputs.release_url }}
            BASE_SOURCE_SHA256=${{ steps.base_source.outputs.archive_sha256 }}
            BASTILLION_VERSION=${{ steps.upstream.outputs.version }}

      - name: Update upstream state and compliance snapshots
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "BASTILLION_VERSION=${{ steps.upstream.outputs.version }}"
            echo "BASTILLION_TAG=${{ steps.upstream.outputs.tag }}"
            echo "BASTILLION_SHA256=${{ steps.upstream.outputs.sha256 }}"
            echo "IMAGE=${IMAGE_NAME}"
            echo "SOURCE_RELEASE=${{ steps.upstream.outputs.release_url }}"
            echo "BASE_IMAGE_NAME=${BASE_IMAGE_NAME}"
            echo "BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}"
            echo "BASE_IMAGE_AMD64_DIGEST=${{ steps.base.outputs.amd64_digest }}"
            echo "BASE_IMAGE_ARM64_DIGEST=${{ steps.base.outputs.arm64_digest }}"
            echo "BASE_SOURCE_OCI_REF=${{ steps.base_source.outputs.oci_digest_ref }}"
            echo "BASE_SOURCE_OCI_DIGEST=${{ steps.base_source.outputs.oci_digest }}"
            echo "BASE_SOURCE_RELEASE_URL=${{ steps.base_source.outputs.release_url }}"
            echo "BASE_SOURCE_SHA256=${{ steps.base_source.outputs.archive_sha256 }}"
          } > .upstream

          cp .build/LICENSE.md UPSTREAM-LICENSE.md
          cp .build/3rdPartyLicenses.md UPSTREAM-THIRD-PARTY-LICENSES.md
          cp .build/compliance/COMPLIANCE.md UPSTREAM-COMPLIANCE.md
          cp .build/compliance/COMPONENTS.tsv UPSTREAM-COMPONENTS.tsv
          cp .build/base-source-pointer.md BASE-IMAGE-SOURCE.md
          cp .build/base-source/inventory/DPKG-PACKAGES-amd64.tsv BASE-IMAGE-PACKAGES-amd64.tsv
          cp .build/base-source/inventory/DPKG-PACKAGES-arm64.tsv BASE-IMAGE-PACKAGES-arm64.tsv
          cp .build/base-source/inventory/PLATFORM-MANIFESTS.tsv BASE-IMAGE-PLATFORMS.tsv
          cp .build/base-source/SOURCE-PACKAGES.tsv BASE-IMAGE-SOURCE-PACKAGES.tsv

          if [[ -z "$(
            git status --porcelain -- \
              .upstream \
              UPSTREAM-LICENSE.md \
              UPSTREAM-THIRD-PARTY-LICENSES.md \
              UPSTREAM-COMPLIANCE.md \
              UPSTREAM-COMPONENTS.tsv \
              BASE-IMAGE-SOURCE.md \
              BASE-IMAGE-PACKAGES-amd64.tsv \
              BASE-IMAGE-PACKAGES-arm64.tsv \
              BASE-IMAGE-PLATFORMS.tsv \
              BASE-IMAGE-SOURCE-PACKAGES.tsv
          )" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .upstream \
            UPSTREAM-LICENSE.md \
            UPSTREAM-THIRD-PARTY-LICENSES.md \
            UPSTREAM-COMPLIANCE.md \
            UPSTREAM-COMPONENTS.tsv \
            BASE-IMAGE-SOURCE.md \
            BASE-IMAGE-PACKAGES-amd64.tsv \
            BASE-IMAGE-PACKAGES-arm64.tsv \
            BASE-IMAGE-PLATFORMS.tsv \
            BASE-IMAGE-SOURCE-PACKAGES.tsv

          git commit -m "chore: update Bastillion upstream compliance to ${{ steps.upstream.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

name: Build and publish

on:
  schedule:
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - ".upstream"
      - "UPSTREAM-LICENSE.md"
      - "UPSTREAM-THIRD-PARTY-LICENSES.md"
      - "UPSTREAM-COMPLIANCE.md"
      - "UPSTREAM-COMPONENTS.tsv"

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-bastillion
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Loophole-LLC/Bastillion
  IMAGE_NAME: ghcr.io/fwe86/docker-bastillion
  MAVEN_DEPENDENCY_PLUGIN_VERSION: "3.11.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine latest stable Bastillion release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest"
          )"

          draft="$(jq -r '.draft' <<< "${release}")"
          prerelease="$(jq -r '.prerelease' <<< "${release}")"
          tag="$(jq -r '.tag_name' <<< "${release}")"
          release_url="$(jq -r '.html_url' <<< "${release}")"

          if [[ "${draft}" != "false" || "${prerelease}" != "false" ]]; then
            echo "ERROR: Latest release is not stable." >&2
            exit 1
          fi

          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "ERROR: No release tag found." >&2
            exit 1
          fi

          version="${tag#v}"
          asset_name="bastillion-${version}.jar"

          asset_count="$(
            jq \
              --arg name "${asset_name}" \
              '[.assets[] | select(.name == $name)] | length' \
              <<< "${release}"
          )"

          if [[ "${asset_count}" != "1" ]]; then
            echo "ERROR: Expected exactly one ${asset_name} asset." >&2
            exit 1
          fi

          asset_url="$(
            jq -r \
              --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              <<< "${release}"
          )"

          digest="$(
            jq -r \
              --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .digest' \
              <<< "${release}"
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Missing or invalid SHA-256 digest." >&2
            exit 1
          fi

          sha256="${digest#sha256:}"

          stored_version="$(
            grep '^BASTILLION_VERSION=' .upstream 2>/dev/null \
              | cut -d= -f2- || true
          )"

          stored_sha256="$(
            grep '^BASTILLION_SHA256=' .upstream 2>/dev/null \
              | cut -d= -f2- || true
          )"

          build="true"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" \
             && "${stored_version}" == "${version}" \
             && "${stored_sha256}" == "${sha256}" ]]; then
            build="false"
          fi

          {
            echo "build=${build}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha256=${sha256}"
            echo "asset_url=${asset_url}"
            echo "release_url=${release_url}"
          } >> "${GITHUB_OUTPUT}"

          echo "Bastillion version: ${version}"
          echo "Build required: ${build}"

      - name: Download and verify upstream release and metadata
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .build/upstream-metadata .build/upstream-npm

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            "${{ steps.upstream.outputs.asset_url }}" \
            --output .build/bastillion.jar

          printf '%s  %s\n' \
            "${{ steps.upstream.outputs.sha256 }}" \
            ".build/bastillion.jar" \
            | sha256sum --check -

          base="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${{ steps.upstream.outputs.tag }}"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/LICENSE.md" \
            --output .build/LICENSE.md

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/3rdPartyLicenses.md" \
            --output .build/3rdPartyLicenses.md

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/pom.xml" \
            --output .build/upstream-metadata/pom.xml

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/package.json" \
            --output .build/upstream-npm/package.json

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "${base}/package-lock.json" \
            --output .build/upstream-npm/package-lock.json

      - name: Set up Java 21 for Maven dependency resolution
        if: steps.upstream.outputs.build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js for npm license collection
        if: steps.upstream.outputs.build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"

      - name: Resolve Maven runtime components and source artifacts
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -f .build/upstream-metadata/pom.xml \
            "org.apache.maven.plugins:maven-dependency-plugin:${MAVEN_DEPENDENCY_PLUGIN_VERSION}:list" \
            -DincludeScope=runtime \
            -DoutputAbsoluteArtifactFilename=true \
            -DappendOutput=false \
            -DoutputFile="${GITHUB_WORKSPACE}/.build/maven-dependencies.txt"

          rm -rf .build/maven-sources
          mkdir -p .build/maven-sources

          mvn \
            --batch-mode \
            --no-transfer-progress \
            -f .build/upstream-metadata/pom.xml \
            "org.apache.maven.plugins:maven-dependency-plugin:${MAVEN_DEPENDENCY_PLUGIN_VERSION}:copy-dependencies" \
            -DincludeScope=runtime \
            -Dclassifier=sources \
            -Dmdep.failOnMissingClassifierArtifact=false \
            -Dmdep.useRepositoryLayout=true \
            -DoutputDirectory="${GITHUB_WORKSPACE}/.build/maven-sources"

      - name: Materialize npm packages from the exact upstream lock file
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        working-directory: .build/upstream-npm
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Build and validate independent third-party compliance bundle
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/collect_compliance.py \
            --upstream-jar .build/bastillion.jar \
            --maven-list .build/maven-dependencies.txt \
            --maven-sources .build/maven-sources \
            --package-lock .build/upstream-npm/package-lock.json \
            --node-modules .build/upstream-npm/node_modules \
            --upstream-version "${{ steps.upstream.outputs.version }}" \
            --upstream-tag "${{ steps.upstream.outputs.tag }}" \
            --upstream-repo "${UPSTREAM_REPO}" \
            --output .build/compliance

          test -s .build/compliance/COMPLIANCE.md
          test -s .build/compliance/COMPONENTS.tsv
          test -s .build/compliance/SHA256SUMS

          (
            cd .build/compliance
            sha256sum --check SHA256SUMS
          )

      - name: Upload compliance evidence
        if: steps.upstream.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bastillion-${{ steps.upstream.outputs.version }}-license-compliance
          path: .build/compliance/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Set up QEMU
        if: steps.upstream.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build verification image
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: docker-bastillion:test
          build-args: |
            BASTILLION_VERSION=${{ steps.upstream.outputs.version }}

      - name: Verify license material inside image
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --entrypoint /bin/sh docker-bastillion:test -c '
            set -eu
            test -s /opt/bastillion/licenses/packaging/LICENSE-MIT
            test -s /opt/bastillion/licenses/upstream/LICENSE.md
            test -s /opt/bastillion/licenses/upstream/3rdPartyLicenses.md
            test -s /opt/bastillion/licenses/compliance/COMPLIANCE.md
            test -s /opt/bastillion/licenses/compliance/COMPONENTS.tsv
            test -s /opt/bastillion/licenses/compliance/SHA256SUMS
            test -d /opt/bastillion/licenses/compliance/maven
            test -d /opt/bastillion/licenses/compliance/npm
            test -d /opt/bastillion/licenses/jar-notices
            test -s /opt/bastillion/licenses/base-image/DPKG-PACKAGES.tsv
            test -s /opt/bastillion/licenses/base-image/JAVA-VERSION.txt
            test -d /opt/java/openjdk/legal
            cd /opt/bastillion/licenses/compliance
            sha256sum -c SHA256SUMS >/dev/null
          '

      - name: Test container
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          container="$(
            docker run \
              --detach \
              --env TLS_ENABLED=false \
              --env PORT=8080 \
              --publish 127.0.0.1:18080:8080 \
              docker-bastillion:test
          )"

          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            running="$(
              docker inspect \
                --format '{{.State.Running}}' \
                "${container}" \
                2>/dev/null || true
            )"

            if [[ "${running}" != "true" ]]; then
              docker logs "${container}" >&2 || true
              exit 1
            fi

            http_code="$(
              curl \
                --silent \
                --output /dev/null \
                --max-time 2 \
                --write-out '%{http_code}' \
                http://127.0.0.1:18080/ \
                2>/dev/null || true
            )"

            if [[ "${http_code}" =~ ^[234][0-9][0-9]$ ]]; then
              echo "Bastillion responded with HTTP ${http_code}."
              exit 0
            fi

            sleep 2
          done

          docker logs "${container}" >&2 || true
          echo "ERROR: Bastillion did not become ready." >&2
          exit 1

      - name: Log in to GitHub Container Registry
        if: steps.upstream.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image with SBOM and provenance
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BASTILLION_VERSION=${{ steps.upstream.outputs.version }}

      - name: Update upstream state and compliance snapshots
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "BASTILLION_VERSION=${{ steps.upstream.outputs.version }}"
            echo "BASTILLION_TAG=${{ steps.upstream.outputs.tag }}"
            echo "BASTILLION_SHA256=${{ steps.upstream.outputs.sha256 }}"
            echo "IMAGE=${IMAGE_NAME}"
            echo "SOURCE_RELEASE=${{ steps.upstream.outputs.release_url }}"
          } > .upstream

          cp .build/LICENSE.md UPSTREAM-LICENSE.md
          cp .build/3rdPartyLicenses.md UPSTREAM-THIRD-PARTY-LICENSES.md
          cp .build/compliance/COMPLIANCE.md UPSTREAM-COMPLIANCE.md
          cp .build/compliance/COMPONENTS.tsv UPSTREAM-COMPONENTS.tsv

          if [[ -z "$(
            git status --porcelain -- \
              .upstream \
              UPSTREAM-LICENSE.md \
              UPSTREAM-THIRD-PARTY-LICENSES.md \
              UPSTREAM-COMPLIANCE.md \
              UPSTREAM-COMPONENTS.tsv
          )" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .upstream \
            UPSTREAM-LICENSE.md \
            UPSTREAM-THIRD-PARTY-LICENSES.md \
            UPSTREAM-COMPLIANCE.md \
            UPSTREAM-COMPONENTS.tsv

          git commit -m "chore: update Bastillion upstream compliance to ${{ steps.upstream.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

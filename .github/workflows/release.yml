name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bastillion version to publish, e.g. 5.2.1, or latest"
        required: true
        default: "latest"
        type: string

  workflow_call:
    inputs:
      version:
        description: "Bastillion version to publish, e.g. 5.2.1, or latest"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: bastillion-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/fetch-upstream.sh
          bash -n scripts/smoke-test.sh

      - name: Fetch and verify Bastillion release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-upstream.sh "${{ inputs.version }}"

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source .build/upstream/metadata.env

          if [[ ! "${BASTILLION_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Unsupported Bastillion version: ${BASTILLION_VERSION}" >&2
            exit 1
          fi

          major="${BASTILLION_VERSION%%.*}"
          remainder="${BASTILLION_VERSION#*.}"
          minor="${remainder%%.*}"

          tags=(
            "${IMAGE_NAME}:${BASTILLION_VERSION}"
          )

          if [[ "${BASTILLION_PRERELEASE}" == "false" ]]; then
            latest_tag="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/Loophole-LLC/Bastillion/releases/latest \
              | python3 -c '
import json
import sys

release = json.load(sys.stdin)
print(release["tag_name"])
'
            )"

            if [[ "${latest_tag}" == "${BASTILLION_TAG}" ]]; then
              tags+=(
                "${IMAGE_NAME}:${major}.${minor}"
                "${IMAGE_NAME}:${major}"
                "${IMAGE_NAME}:latest"
              )
            else
              echo "This is not the current upstream latest stable release."
              echo "Only the exact version tag will be published."
            fi
          fi

          {
            echo "version=${BASTILLION_VERSION}"
            echo "tag=${BASTILLION_TAG}"
            echo "prerelease=${BASTILLION_PRERELEASE}"
            echo "tags<<EOF_TAGS"
            printf '%s\n' "${tags[@]}"
            echo "EOF_TAGS"
          } >> "${GITHUB_OUTPUT}"

          echo "Tags to publish:"
          printf '  %s\n' "${tags[@]}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 verification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: docker-bastillion:release-test
          build-args: |
            BASTILLION_VERSION=${{ steps.release.outputs.version }}

      - name: Smoke test
        shell: bash
        run: ./scripts/smoke-test.sh docker-bastillion:release-test

      - name: Scan verification image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker-bastillion:release-test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            BASTILLION_VERSION=${{ steps.release.outputs.version }}

      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail

          image="${IMAGE_NAME}:${{ steps.release.outputs.version }}"

          docker buildx imagetools inspect "${image}" | tee /tmp/manifest.txt

          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt

          echo "Published manifest contains linux/amd64 and linux/arm64."

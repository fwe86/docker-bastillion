name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/fetch-upstream.sh
          bash -n scripts/smoke-test.sh

      - name: Fetch and verify Bastillion upstream release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-upstream.sh

      - name: Read Bastillion version
        id: upstream
        shell: bash
        run: |
          source .build/upstream/metadata.env
          echo "version=${BASTILLION_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: docker-bastillion:ci
          build-args: |
            BASTILLION_VERSION=${{ steps.upstream.outputs.version }}

      - name: Smoke test
        shell: bash
        run: ./scripts/smoke-test.sh docker-bastillion:ci
